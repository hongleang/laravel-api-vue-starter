# Local development stack: Laravel API (nginx + PHP-FPM), MySQL

x-backend: &backend
  build:
    context: ./backend
    target: dev
    args:
      UID: 501
      GID: 20
  image: laravel-api-vue-starter-backend:dev
  volumes:
    - ./backend:/var/www/html
  working_dir: /var/www/html

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8000:80'
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    <<: *backend
    depends_on:
      - mysql
      - mailpit

  frontend:
    build:
      context: ./frontend
    image: laravel-api-vue-starter-frontend:dev
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_DEV_HOST: 0.0.0.0
      VITE_USE_POLLING: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starter
      MYSQL_USER: starter
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - '33060:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  # Throwaway database for the test suite. tmpfs keeps it fast and empty on every start.
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starter_test
      MYSQL_USER: starter
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - '33061:3306'
    tmpfs:
      - /var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mysql-data:
  frontend-node-modules:
